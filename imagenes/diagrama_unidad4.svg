<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="220">
  <rect width="600" height="220" fill="#f8fafc" stroke="#cbd5e1" rx="8"/>
  <text x="300" y="24" text-anchor="middle" fill="#1e3a8a" font-family="Arial" font-size="13" font-weight="bold">Diseño Modular y Grafo de Flujo de Caja Blanca V(G) (Fuente: Myers / McCabe)</text>
  <rect x="25" y="45" width="230" height="150" fill="#ffffff" stroke="#94a3b8" rx="6"/>
  <text x="140" y="64" text-anchor="middle" fill="#1e3a8a" font-family="Arial" font-size="11" font-weight="bold">4 Modelos del Diseño (IEEE 1016)</text>
  <rect x="45" y="74" width="190" height="24" fill="#dbeafe" rx="3"/>
  <text x="140" y="90" text-anchor="middle" fill="#1e3a8a" font-family="Arial" font-size="10" font-weight="bold">1. Diseño de Datos (Tablas)</text>
  <rect x="45" y="102" width="190" height="24" fill="#bfdbfe" rx="3"/>
  <text x="140" y="118" text-anchor="middle" fill="#1e3a8a" font-family="Arial" font-size="10" font-weight="bold">2. Diseño Arquitectónico</text>
  <rect x="45" y="130" width="190" height="24" fill="#93c5fd" rx="3"/>
  <text x="140" y="146" text-anchor="middle" fill="#1e3a8a" font-family="Arial" font-size="10" font-weight="bold">3. Interfaz Hombre-Máquina</text>
  <rect x="45" y="158" width="190" height="24" fill="#60a5fa" rx="3"/>
  <text x="140" y="174" text-anchor="middle" fill="#fff" font-family="Arial" font-size="10" font-weight="bold">4. Diseño Procedimental (PDL)</text>
  <rect x="280" y="45" width="295" height="150" fill="#ffffff" stroke="#94a3b8" rx="6"/>
  <text x="427" y="64" text-anchor="middle" fill="#1e3a8a" font-family="Arial" font-size="11" font-weight="bold">Grafo Ciclomático McCabe: V(G) = P + 1</text>
  <circle cx="320" cy="120" r="14" fill="#1e3a8a"/><text x="320" y="124" text-anchor="middle" fill="#fff" font-size="10">1</text>
  <circle cx="385" cy="120" r="14" fill="#2563eb"/><text x="385" y="124" text-anchor="middle" fill="#fff" font-size="10">2(P)</text>
  <circle cx="455" cy="88" r="14" fill="#2563eb"/><text x="455" y="92" text-anchor="middle" fill="#fff" font-size="10">3(P)</text>
  <circle cx="455" cy="152" r="14" fill="#475569"/><text x="455" y="156" text-anchor="middle" fill="#fff" font-size="10">4</text>
  <circle cx="535" cy="120" r="14" fill="#047857"/><text x="535" y="124" text-anchor="middle" fill="#fff" font-size="10">5</text>
  <line x1="334" y1="120" x2="371" y2="120" stroke="#1e3a8a" stroke-width="2"/>
  <line x1="397" y1="112" x2="441" y2="92" stroke="#1e3a8a" stroke-width="2"/>
  <line x1="397" y1="128" x2="441" y2="148" stroke="#1e3a8a" stroke-width="2"/>
  <line x1="469" y1="92" x2="521" y2="114" stroke="#1e3a8a" stroke-width="2"/>
  <line x1="455" y1="102" x2="455" y2="138" stroke="#1e3a8a" stroke-width="2"/>
  <line x1="469" y1="148" x2="521" y2="126" stroke="#1e3a8a" stroke-width="2"/>
  <text x="427" y="184" text-anchor="middle" fill="#334155" font-family="Arial" font-size="10">A=6, N=5, P=2 predicados → V(G) = 6 - 5 + 2 = 3 caminos</text>
</svg>